# Supabase pauses free projects after 7 days without activity.
# This pings the database every 3 days so it never pauses.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          if [ -z "$URL" ]; then echo "No Supabase URL in .env.production - skipping"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
